runtime:
  window_size: 50
  step: 10
  replay_delay_seconds: 0.0
  strict_csv: false
  source: replay-csv
detector:
  packet_count_threshold: 500
  event_rate_threshold: 200.0
  unique_source_ip_threshold: 100
  attack_count_threshold: 1
  use_isolation_forest: false
alerts:
  source: edge-security-runtime
  default_recommended_action: Review source telemetry, correlate with IDS logs, and
    isolate affected lab systems if confirmed.
mqtt:
  broker_url: mqtt://localhost:1883
  topics:
    - edge-security/telemetry/#
  client_id: edge-security
  qos: 0
  keepalive: 60
  queue_size: 10000
  # canonical TelemetryEvent field -> accepted JSON payload keys (overlays the built-in defaults)
  field_map:
    timestamp: [timestamp, frame.time_epoch, ts, time]
    source_ip: [source_ip, ip.src_host, src_ip, device_ip]
    dest_ip: [dest_ip, ip.dst_host, dst_ip]
    source_port: [source_port, tcp.srcport, udp.srcport, src_port]
    dest_port: [dest_port, tcp.dstport, udp.dstport, dst_port]
    protocol: [protocol, _ws.col.protocol, proto]
    packet_size: [packet_size, frame.len, bytes, size]
    attack_label: [attack_label, label]
    attack_type: [attack_type, category]
sinks:
  # All sinks are off by default; the runtime stays fully offline.
  jsonl:
    enabled: false
    path: reports/live/alerts.jsonl
    append: true
  sqlite:
    enabled: false
    db_path: data/alerts.db
  iot_core:
    enabled: false
    # Leave empty to read EDGE_SECURITY_IOT_ENDPOINT / _THING / _CERT / _KEY / _CA
    # from the environment. Never commit endpoints, certificates, or keys.
    endpoint: ""
    thing_name: ""
    cert_path: ""
    key_path: ""
    ca_path: ""
    port: 8883
    topic_root: edge-security
    qos: 1
    queue_size: 1000
    max_retries: 5
    backoff_base_seconds: 0.5
    backoff_max_seconds: 30.0
    health_interval_windows: 100
models:
  forecaster_active: mock-forecaster
